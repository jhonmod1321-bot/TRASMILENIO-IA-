<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmi App</title>
<style>
body{margin:0;background:#141416;color:#f0eeea;font:16px/1.4 system-ui,sans-serif;padding:14px}
h1{margin:0 0 6px;font-size:1.2rem;color:#fff}
#estado{font-size:.9rem;margin-bottom:10px;color:#ff6b6b}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #34343a;border-radius:6px;background:#1f1f23;color:#f0eeea;font:inherit}
button{margin:10px 8px 0 0;padding:13px 16px;border:0;border-radius:6px;background:#c8102e;color:#fff;font:inherit;font-weight:700}
.item{display:block;width:100%;text-align:left;margin:8px 0 0;background:#1f1f23;border:1px solid #34343a;font-weight:400}
.fila{display:flex;justify-content:space-between;gap:10px;background:#1f1f23;border:1px solid #34343a;border-radius:6px;padding:12px;margin-top:8px}
.min{font-size:1.4rem;font-weight:800;color:#ff4d6a;white-space:nowrap}
.sub{color:#a0a0a8;font-size:.9rem}
hr{border:0;border-top:1px solid #34343a;margin:16px 0}
#msg,#mmsg{margin-top:10px;color:#ff6b6b;word-break:break-word}
details{margin-top:12px}
summary{padding:12px;background:#1f1f23;border:1px solid #34343a;border-radius:6px;font-weight:700}
#ia{white-space:pre-wrap;padding:12px;background:#1f1f23;border-left:4px solid #c8102e;border-radius:6px;margin-top:8px;word-break:break-word}
#mapa{height:340px;border-radius:6px;margin-top:10px;background:#1f1f23}
</style>
</head>
<body>
<h1>Transmi App v8</h1>
<div id="estado">JS no arrancó</div>

<details id="det-claves">
  <summary>Claves (toca para abrir)</summary>
  <label>Clave de Croma</label>
  <input id="k-croma" type="password" autocomplete="off">
  <label>Clave de Gemini</label>
  <input id="k-gemini" type="password" autocomplete="off">
  <label>Clave de Groq</label>
  <input id="k-groq" type="password" autocomplete="off">
  <button type="button" onclick="guardar()">Guardar claves</button>
  <div id="ok" class="sub"></div>
</details>

<hr>

<label>Pregúntale a la IA</label>
<input id="pq" placeholder="¿Cuánto demora el 614 desde aquí?">
<button type="button" onclick="preguntar()">Preguntar</button>

<details id="det-plan">
  <summary>Cómo llegar a un destino</summary>
  <label>¿A dónde vas?</label>
  <input id="dest" placeholder="Portal Norte, Universidad Nacional…">
  <button type="button" onclick="planear()">Buscar ruta desde mi ubicación</button>
  <div id="plan" class="sub"></div>
</details>

<hr>

<label>Busca una estación o paradero</label>
<input id="q" placeholder="Portal Norte, Calle 72…">
<button type="button" onclick="buscar()">Buscar</button>
<button type="button" onclick="cerca()">Paraderos cerca de mí</button>
<div id="msg"></div>

<div id="iabox" style="display:none">
  <details id="det-ia" open>
    <summary>Respuesta de la IA (toca para ocultar o mostrar)</summary>
    <div id="ia"></div>
  </details>
</div>

<div id="lista"></div>

<div id="llbox" style="display:none">
  <details id="det-ll" open>
    <summary id="titulo">Llegadas</summary>
    <div id="llegadas"></div>
    <label>Avisarme cuando llegue la ruta</label>
    <input id="av" placeholder="Ej: 614 (déjalo vacío para quitar el aviso)">
    <button type="button" onclick="activarAviso()">Activar aviso</button>
    <button type="button" onclick="agregarFav()">Guardar en favoritos</button>
    <div id="avok" class="sub"></div>
    <div id="favok" class="sub"></div>
  </details>
  <details id="det-ap">
    <summary>Alertas de este paradero</summary>
    <div id="alertas-p"></div>
  </details>
</div>

<details id="det-mapa">
  <summary>Mapa en vivo</summary>
  <label>Ruta</label>
  <input id="mr" placeholder="614, B10, H75…">
  <button type="button" onclick="verMapa()">Ver buses en el mapa</button>
  <div id="mmsg"></div>
  <div id="mapa"></div>
</details>

<details id="det-fav">
  <summary>Mis favoritos</summary>
  <div id="favs"></div>
</details>

<details id="det-ar">
  <summary>Alertas de toda la red</summary>
  <button type="button" onclick="alertas(null)">Ver alertas ahora</button>
  <div id="alertas-r"></div>
</details>

<script>
function $(id) { return document.getElementById(id); }
var timer = null, ULT = null, SEL = null, AVISO = null, ULTAVISO = 0;
var MAPA = null, CAPA = null, MTIMER = null;
var MODELO_GEMINI = 'gemini-3.8-flash';
var MODELO_GROQ = 'openai/gpt-oss-20b';
var SISTEMA = 'Eres el asistente de una app de TransMilenio en Bogotá. Responde en español colombiano, claro y corto (máximo 4 frases), usando SOLO los datos que te doy. No uses asteriscos ni formato markdown. Si hay un error, explica en palabras simples qué pasó y qué puede hacer la persona. No inventes buses, rutas ni tiempos. Si los datos no alcanzan para responder, dilo.';

window.onerror = function (m) { $('estado').style.color = '#ff6b6b'; $('estado').textContent = 'Error: ' + m; };

function leer(k) { try { return localStorage.getItem('clave_' + k) || ''; } catch (e) { return ''; } }
function escribir(k, v) { try { localStorage.setItem('clave_' + k, v); } catch (e) {} }

function guardar() {
  ['croma', 'gemini', 'groq'].forEach(function (k) { escribir(k, $('k-' + k).value.trim()); });
  $('ok').textContent = 'Claves guardadas.';
}

async function croma(ruta, cuerpo) {
  var clave = $('k-croma').value.trim() || leer('croma');
  var r = await fetch('https://api.croma.run/co/transmilenio/' + ruta, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + clave, 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo)
  });
  var texto = await r.text();
  if (!r.ok) throw new Error('Croma respondió con error ' + r.status + ': ' + texto.slice(0, 300));
  try { return JSON.parse(texto); }
  catch (e) { throw new Error('Respuesta que no es JSON: ' + texto.slice(0, 300)); }
}

function sacarLista(d, nombre) {
  if (d && Array.isArray(d[nombre])) return d[nombre];
  if (d && d.data && Array.isArray(d.data[nombre])) return d.data[nombre];
  if (d && d.result && Array.isArray(d.result[nombre])) return d.result[nombre];
  throw new Error('Formato inesperado. Croma respondió: ' + JSON.stringify(d).slice(0, 400));
}

/* ---------- IA: Gemini primero, Groq de respaldo ---------- */
async function ia(contexto, pregunta) {
  var errs = [];
  var gk = $('k-gemini').value.trim() || leer('gemini');
  var qk = $('k-groq').value.trim() || leer('groq');
  var texto = pregunta + '\n\nDATOS:\n' + contexto.slice(0, 3500);
  if (gk) {
    try {
      var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODELO_GEMINI + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': gk },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SISTEMA }] },
          contents: [{ role: 'user', parts: [{ text: texto }] }]
        })
      });
      var j = await r.json();
      if (!r.ok) throw new Error(r.status + ' ' + JSON.stringify(j).slice(0, 200));
      return { texto: j.candidates[0].content.parts[0].text, quien: 'Gemini' };
    } catch (e) { errs.push('Gemini: ' + e.message); }
  }
  if (qk) {
    try {
      var r2 = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + qk },
        body: JSON.stringify({ model: MODELO_GROQ, messages: [{ role: 'system', content: SISTEMA }, { role: 'user', content: texto }] })
      });
      var j2 = await r2.json();
      if (!r2.ok) throw new Error(r2.status + ' ' + JSON.stringify(j2).slice(0, 200));
      return { texto: j2.choices[0].message.content, quien: 'Groq' };
    } catch (e) { errs.push('Groq: ' + e.message); }
  }
  throw new Error(errs.length ? errs.join(' | ') : 'No hay claves de IA guardadas.');
}

async function decir(pregunta, contexto, subir) {
  $('iabox').style.display = 'block';
  $('det-ia').open = true;
  $('ia').textContent = 'La IA está pensando…';
  try {
    var r = await ia(contexto, pregunta);
    $('ia').textContent = r.texto.replace(/\*\*/g, '') + '\n\n(respondió ' + r.quien + ')';
  } catch (e) {
    $('ia').textContent = 'La IA no pudo responder: ' + e.message;
  }
  if (subir) { $('iabox').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

/* ---------- Ubicación, tipo y distancia ---------- */
function tipo(s) {
  var sy = s.systems || [], t = [];
  if (sy.indexOf('troncal') >= 0 || sy.indexOf('dual') >= 0) t.push('TransMilenio');
  if (sy.indexOf('alimentador') >= 0) t.push('Alimentador');
  if (sy.some(function (z) { return z.indexOf('zonal') === 0; })) t.push('SITP');
  if (sy.indexOf('transmicable') >= 0) t.push('TransMiCable');
  return t.join(' + ') || 'Paradero';
}

function metros(a, b, c, d) {
  var R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function ubicacion() {
  var G = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
  var u;
  if (G) {
    await G.requestPermissions();
    var p = await G.getCurrentPosition({ enableHighAccuracy: true });
    u = { lat: p.coords.latitude, lon: p.coords.longitude };
  } else {
    u = await new Promise(function (ok, no) {
      navigator.geolocation.getCurrentPosition(function (p) { ok({ lat: p.coords.latitude, lon: p.coords.longitude }); }, no);
    });
  }
  ULT = u;
  return u;
}

function ubicacionRapida() {
  return Promise.race([ubicacion(), new Promise(function (ok) { setTimeout(function () { ok(ULT); }, 5000); })]).catch(function () { return ULT; });
}

/* ---------- Lista de paraderos ---------- */
function mostrarParaderos(stops) {
  $('lista').innerHTML = '';
  stops.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    var n = document.createElement('strong');
    n.textContent = s.name;
    var sub = document.createElement('div');
    sub.className = 'sub';
    var partes = [tipo(s), s.kind === 'station' ? 'Estación' : 'Paradero'];
    if (typeof s.distance_m === 'number') partes.push('a ' + Math.round(s.distance_m) + ' m');
    sub.textContent = partes.join(' · ');
    b.appendChild(n); b.appendChild(sub);
    b.onclick = function () { elegir(s); };
    $('lista').appendChild(b);
  });
}

function resumenParaderos(stops) {
  return JSON.stringify(stops.map(function (s) {
    return { nombre: s.name, tipo: tipo(s), distancia_m: typeof s.distance_m === 'number' ? Math.round(s.distance_m) : undefined, rutas: (s.route_codes || []).slice(0, 12) };
  }));
}

async function buscar() {
  var q = $('q').value.trim();
  $('msg').textContent = 'Buscando…'; $('lista').innerHTML = '';
  try {
    var stops = sacarLista(await croma('stops-search/v1', { query: q, per_page: 10 }), 'stops');
    var u = await ubicacionRapida();
    if (u) {
      stops.forEach(function (s) {
        if (typeof s.latitude === 'number') s.distance_m = metros(u.lat, u.lon, s.latitude, s.longitude);
      });
      stops.sort(function (a, b) { return (a.distance_m || 1e12) - (b.distance_m || 1e12); });
    }
    $('msg').textContent = stops.length ? 'Elige un paradero:' : 'No encontré paraderos con ese nombre.';
    mostrarParaderos(stops);
    decir('La persona buscó "' + q + '". Cuéntale en pocas frases qué paraderos encontraste, de qué tipo son y cuál le conviene elegir.', resumenParaderos(stops), false);
  } catch (e) {
    $('msg').textContent = 'No se pudo buscar: ' + e.message;
    decir('Hubo un error al buscar paraderos. Explícale a la persona qué pasó y qué puede hacer.', e.message, false);
  }
}

async function cerca() {
  $('msg').textContent = 'Buscando tu ubicación…'; $('lista').innerHTML = '';
  try {
    var u = await ubicacion();
    var stops = sacarLista(await croma('stops-search/v1', { latitude: u.lat, longitude: u.lon, radius_m: 600, per_page: 10 }), 'stops');
    $('msg').textContent = stops.length ? 'Paraderos cerca de ti:' : 'No hay paraderos a 600 metros.';
    mostrarParaderos(stops);
    decir('Estos son los paraderos cerca de la persona. Dile en pocas frases cuál es el más cercano, de qué tipo es y qué rutas pasan.', resumenParaderos(stops), false);
  } catch (e) {
    $('msg').textContent = 'No pude buscar cerca de ti: ' + (e.message || e);
    decir('Hubo un error al buscar paraderos cercanos. Explícale a la persona qué pasó y qué puede hacer.', String(e.message || e), false);
  }
}

/* ---------- Llegadas ---------- */
function elegir(s) {
  SEL = s;
  $('lista').innerHTML = '';
  $('titulo').textContent = s.name + ' (toca para ocultar o mostrar)';
  $('llbox').style.display = 'block';
  $('det-ll').open = true;
  $('favok').textContent = '';
  clearInterval(timer);
  cargar(s, true);
  alertas(s.stop_id);
  timer = setInterval(function () { cargar(s, false); }, 20000);
}

async function cargar(s, conIA) {
  try {
    var llegadas = sacarLista(await croma('stop-arrivals/v1', { stop_id: s.stop_id, limit: 10 }), 'arrivals');
    $('llegadas').innerHTML = '';
    if (!llegadas.length) { $('llegadas').textContent = 'No hay buses en camino ahora.'; }
    llegadas.forEach(function (a) {
      var atraso = Math.round(a.delay_seconds / 60);
      var nota = atraso > 0 ? 'va ' + atraso + ' min atrasado' : 'a tiempo';
      var fila = document.createElement('div');
      fila.className = 'fila';
      var izq = document.createElement('div');
      var t1 = document.createElement('strong');
      t1.textContent = a.route_code;
      var t2 = document.createElement('div');
      t2.className = 'sub';
      t2.textContent = a.route_name + ' · ' + nota;
      izq.appendChild(t1); izq.appendChild(t2);
      var der = document.createElement('div');
      der.className = 'min';
      der.textContent = Math.round(a.minutes_away) + ' min';
      fila.appendChild(izq); fila.appendChild(der);
      $('llegadas').appendChild(fila);
    });
    revisarAviso(llegadas);
    if (conIA) {
      decir('Estas son las llegadas en vivo al paradero ' + s.name + '. Dile a la persona qué bus llega primero y si hay retrasos.',
        JSON.stringify(llegadas.slice(0, 8).map(function (a) {
          return { ruta: a.route_code, destino: a.route_name, minutos: Math.round(a.minutes_away), atraso_segundos: a.delay_seconds };
        })), true);
    }
  } catch (e) {
    $('llegadas').textContent = 'No se pudieron cargar las llegadas: ' + e.message;
    if (conIA) decir('Hubo un error al cargar las llegadas. Explícale a la persona qué pasó y qué puede hacer.', e.message, true);
  }
}

/* ---------- Aviso de bus cercano (notificación) ---------- */
function ln() { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications; }

async function activarAviso() {
  var r = $('av').value.trim().toUpperCase();
  if (!r) { AVISO = null; $('avok').textContent = 'Aviso desactivado.'; return; }
  AVISO = r;
  var L = ln();
  if (L) { try { await L.requestPermissions(); } catch (e) {} }
  $('avok').textContent = 'Te aviso cuando la ruta ' + r + ' esté a 3 minutos o menos. Funciona con la app abierta.';
}

async function notificar(titulo, cuerpo) {
  var L = ln();
  if (L) {
    try { await L.schedule({ notifications: [{ id: Math.floor(Date.now() % 2000000000), title: titulo, body: cuerpo }] }); return; } catch (e) {}
  }
  $('estado').style.color = '#5ddf8a';
  $('estado').textContent = titulo + ': ' + cuerpo;
}

function revisarAviso(llegadas) {
  if (!AVISO) return;
  var m = llegadas.filter(function (a) { return String(a.route_code).toUpperCase() === AVISO && a.minutes_away <= 3; })[0];
  if (m && Date.now() - ULTAVISO > 120000) {
    ULTAVISO = Date.now();
    notificar('Tu bus ' + AVISO + ' está cerca', 'Llega en ' + Math.max(0, Math.round(m.minutes_away)) + ' min a ' + (SEL ? SEL.name : 'tu paradero') + '.');
  }
}

/* ---------- Alertas del servicio ---------- */
async function alertas(stopId) {
  var cont = $(stopId ? 'alertas-p' : 'alertas-r');
  cont.textContent = 'Cargando…';
  try {
    var l = sacarLista(await croma('alerts/v1', stopId ? { stop_id: stopId } : {}), 'alerts');
    cont.innerHTML = '';
    if (!l.length) { cont.textContent = 'Sin alertas por ahora.'; return; }
    l.slice(0, 10).forEach(function (a) {
      var div = document.createElement('div');
      div.className = 'fila';
      var x = document.createElement('div');
      var h = document.createElement('strong');
      h.textContent = a.header || a.effect || 'Alerta';
      var s = document.createElement('div');
      s.className = 'sub';
      s.textContent = (a.description || '').slice(0, 220);
      x.appendChild(h); x.appendChild(s); div.appendChild(x);
      cont.appendChild(div);
    });
  } catch (e) { cont.textContent = 'No pude cargar alertas: ' + e.message; }
}

/* ---------- Favoritos ---------- */
function favs() { try { return JSON.parse(localStorage.getItem('favs') || '[]'); } catch (e) { return []; } }
function guardarFavs(a) { try { localStorage.setItem('favs', JSON.stringify(a)); } catch (e) {} }

function pintarFavs() {
  var cont = $('favs'), a = favs();
  cont.innerHTML = '';
  if (!a.length) { cont.textContent = 'Aún no tienes favoritos. Elige un paradero y toca “Guardar en favoritos”.'; return; }
  a.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    b.textContent = s.name;
    b.onclick = function () { elegir(s); window.scrollTo(0, 0); };
    cont.appendChild(b);
  });
}

function agregarFav() {
  if (!SEL) return;
  var a = favs();
  if (!a.some(function (x) { return x.stop_id === SEL.stop_id; })) {
    a.push({ stop_id: SEL.stop_id, name: SEL.name });
    guardarFavs(a);
  }
  pintarFavs();
  $('favok').textContent = 'Guardado en favoritos.';
}

/* ---------- Cómo llegar (rutas directas) ---------- */
async function planear() {
  var dest = $('dest').value.trim();
  if (!dest) return;
  $('plan').textContent = 'Buscando ruta…';
  try {
    var u = await ubicacion();
    var dd = sacarLista(await croma('stops-search/v1', { query: dest, per_page: 10 }), 'stops');
    if (!dd.length) { $('plan').textContent = 'No encontré ese destino.'; return; }
    var codDest = {};
    dd.forEach(function (s) { (s.route_codes || []).forEach(function (c) { codDest[c] = true; }); });
    var oo = sacarLista(await croma('stops-search/v1', { latitude: u.lat, longitude: u.lon, radius_m: 800, per_page: 20 }), 'stops');
    var op = [];
    oo.forEach(function (s) {
      var comunes = (s.route_codes || []).filter(function (c) { return codDest[c]; });
      if (comunes.length) op.push({ s: s, comunes: comunes });
    });
    op = op.slice(0, 3);
    var res = { destino: dest, destinos_encontrados: dd.slice(0, 3).map(function (s) { return s.name; }), opciones: [] };
    $('plan').innerHTML = '';
    if (!op.length) {
      $('plan').textContent = 'No encontré una ruta directa desde los paraderos a 800 m de ti. Prueba con otro destino cercano.';
      decir('La persona quiere ir a "' + dest + '" pero no hay rutas directas desde los paraderos a 800 m. Díselo y sugiere buscar un destino cercano o un transbordo.', JSON.stringify(res), true);
      return;
    }
    for (var i = 0; i < op.length; i++) {
      var o = op[i], proximos = [];
      try {
        proximos = sacarLista(await croma('stop-arrivals/v1', { stop_id: o.s.stop_id, limit: 20 }), 'arrivals')
          .filter(function (a) { return o.comunes.indexOf(a.route_code) >= 0; }).slice(0, 3);
      } catch (e) {}
      var dist = Math.round(o.s.distance_m || 0);
      var fila = document.createElement('div');
      fila.className = 'fila';
      var izq = document.createElement('div');
      var t1 = document.createElement('strong');
      t1.textContent = o.s.name + ' · a ' + dist + ' m';
      var t2 = document.createElement('div');
      t2.className = 'sub';
      t2.textContent = 'Rutas que van: ' + o.comunes.slice(0, 8).join(', ') + (proximos.length ? ' · próximo: ' + proximos.map(function (a) { return a.route_code + ' en ' + Math.round(a.minutes_away) + ' min'; }).join(', ') : ' · sin buses en camino ahora');
      izq.appendChild(t1); izq.appendChild(t2); fila.appendChild(izq);
      $('plan').appendChild(fila);
      res.opciones.push({ paradero: o.s.name, distancia_m: dist, rutas: o.comunes.slice(0, 8), proximos: proximos.map(function (a) { return { ruta: a.route_code, minutos: Math.round(a.minutes_away) }; }) });
    }
    var nota = document.createElement('div');
    nota.className = 'sub';
    nota.textContent = 'Son rutas directas probables. Confirma el sentido del recorrido en el bus.';
    $('plan').appendChild(nota);
    decir('La persona quiere ir a "' + dest + '". Explícale en pocas frases cuál opción le conviene y por qué.', JSON.stringify(res), true);
  } catch (e) {
    $('plan').textContent = 'No pude planear el viaje: ' + (e.message || e);
  }
}

/* ---------- Mapa en vivo ---------- */
function cargarLeaflet() {
  return new Promise(function (ok, no) {
    if (window.L) { ok(); return; }
    var c = document.createElement('link');
    c.rel = 'stylesheet';
    c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(c);
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    s.onload = ok;
    s.onerror = function () { no(new Error('No se pudo cargar el mapa. Revisa tu internet.')); };
    document.head.appendChild(s);
  });
}

async function pintarBuses(r, ajustar) {
  var v = sacarLista(await croma('vehicles/v1', { route: r, per_page: 200 }), 'vehicles');
  CAPA.clearLayers();
  var pts = [];
  v.forEach(function (x) {
    if (typeof x.latitude !== 'number') return;
    var p = [x.latitude, x.longitude];
    pts.push(p);
    L.circleMarker(p, { radius: 6, color: '#ffffff', weight: 1, fillColor: '#c8102e', fillOpacity: 1 })
      .bindTooltip((x.route_code || r) + ' · ' + Math.round(x.speed_kmh || 0) + ' km/h' + (x.stop_name ? ' · hacia ' + x.stop_name : '')).addTo(CAPA);
  });
  if (ULT) {
    L.circleMarker([ULT.lat, ULT.lon], { radius: 8, color: '#ffffff', weight: 2, fillColor: '#2e7cf6', fillOpacity: 1 }).bindTooltip('Tú').addTo(CAPA);
  }
  $('mmsg').textContent = v.length ? v.length + ' buses de la ruta ' + r + ' en vía ahora.' : 'No hay buses de esa ruta en vía ahora.';
  if (ajustar && pts.length) { MAPA.fitBounds(pts, { padding: [30, 30] }); }
  setTimeout(function () { MAPA.invalidateSize(); }, 200);
}

async function verMapa() {
  var r = $('mr').value.trim().toUpperCase();
  if (!r) { $('mmsg').textContent = 'Escribe una ruta, por ejemplo 614 o B10.'; return; }
  $('mmsg').textContent = 'Cargando mapa…';
  try {
    await cargarLeaflet();
    if (!MAPA) {
      MAPA = L.map('mapa').setView([4.65, -74.08], 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© CARTO, © OpenStreetMap' }).addTo(MAPA);
      CAPA = L.layerGroup().addTo(MAPA);
    }
    await ubicacionRapida();
    await pintarBuses(r, true);
    clearInterval(MTIMER);
    MTIMER = setInterval(function () { pintarBuses(r, false).catch(function () {}); }, 20000);
  } catch (e) { $('mmsg').textContent = e.message; }
}

/* ---------- Pregunta libre a la IA con datos reales ---------- */
async function preguntar() {
  var q = $('pq').value.trim();
  if (!q) { return; }
  $('iabox').style.display = 'block';
  $('det-ia').open = true;
  $('ia').textContent = 'Reuniendo datos de TransMilenio…';
  $('iabox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  var contexto = {};
  try {
    var u = await ubicacion();
    contexto.ubicacion_persona = u;
    var m = q.match(/\b([A-Za-z]{0,2}\d{1,3}[A-Za-z]?)\b/);
    if (m) {
      try {
        var v = await croma('vehicles/v1', { route: m[1].toUpperCase(), latitude: u.lat, longitude: u.lon, radius_m: 5000, per_page: 5 });
        contexto.ruta_preguntada = m[1].toUpperCase();
        contexto.buses_de_esa_ruta_cerca = sacarLista(v, 'vehicles').map(function (x) {
          return { distancia_m: Math.round(x.distance_m || 0), velocidad_kmh: x.speed_kmh, hacia: x.stop_name, estado: x.stop_status, destino: x.route_name };
        });
      } catch (e) { contexto.buses_de_esa_ruta_cerca = 'no disponible: ' + (e.message || e); }
    }
    var stops = sacarLista(await croma('stops-search/v1', { latitude: u.lat, longitude: u.lon, radius_m: 700, per_page: 5 }), 'stops');
    contexto.paraderos_cercanos = [];
    for (var i = 0; i < Math.min(3, stops.length); i++) {
      var s = stops[i];
      var item = { nombre: s.name, tipo: tipo(s), distancia_m: Math.round(s.distance_m || 0), rutas: (s.route_codes || []).slice(0, 12) };
      try {
        item.proximos_buses = sacarLista(await croma('stop-arrivals/v1', { stop_id: s.stop_id, limit: 5 }), 'arrivals').map(function (x) {
          return { ruta: x.route_code, destino: x.route_name, minutos: Math.round(x.minutes_away), atraso_segundos: x.delay_seconds };
        });
      } catch (e) { item.proximos_buses = 'no disponible'; }
      contexto.paraderos_cercanos.push(item);
    }
  } catch (e) {
    contexto.aviso = 'No se pudieron obtener los datos: ' + (e.message || e);
  }
  decir('Pregunta de la persona: "' + q + '". Responde con los datos. Si no alcanzan para responder completo, dilo y sugiere qué paradero y bus tomar primero.', JSON.stringify(contexto), true);
}
