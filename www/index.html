<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmi App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<style>
:root{--bg:#f6f4f1;--fg:#1b1b1f;--card:#ffffff;--line:#ddd8d2;--red:#c8102e;--muted:#6b6b70}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#f0eeea;--card:#1f1f23;--line:#34343a;--muted:#a0a0a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px;font-weight:700;font-size:1.15rem}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--red)}
main{max-width:560px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
label{display:block;margin:14px 0 4px;font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.btn{margin-top:12px;margin-right:8px;padding:11px 16px;border:0;border-radius:6px;background:var(--red);color:#fff;font:inherit;font-weight:700}
.item{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.min{font-size:1.5rem;font-weight:800;color:var(--red);white-space:nowrap}
.sub{color:var(--muted);font-size:.9rem}
#msg{margin-top:12px;color:var(--red)}
</style>
</head>
<body>
<header>Transmi App</header>
<nav>
  <button id="t-llegadas" class="on" onclick="tab('llegadas')">Llegadas</button>
  <button id="t-ajustes" onclick="tab('ajustes')">Ajustes</button>
</nav>
<main>
  <section id="s-llegadas" class="on">
    <label for="q">Busca una estación o paradero</label>
    <input id="q" placeholder="Portal Norte, Calle 72…">
    <button class="btn" onclick="buscar()">Buscar</button>
    <button class="btn" onclick="cerca()">Paraderos cerca de mí</button>
    <div id="msg"></div>
    <div id="lista"></div>
    <h3 id="titulo"></h3>
    <div id="llegadas"></div>
  </section>

  <section id="s-ajustes">
    <p class="sub">Tus claves se guardan solo en este dispositivo.</p>
    <label for="k-croma">Clave de Croma</label>
    <input id="k-croma" type="password" autocomplete="off">
    <label for="k-gemini">Clave
