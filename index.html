<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmi App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<style>
:root{--bg:#f6f4f1;--fg:#1b1b1f;--card:#ffffff;--line:#ddd8d2;--red:#c8102e;--muted:#6b6b70}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#f0eeea;--card:#1f1f23;--line:#34343a;--muted:#a0a0a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px;font-weight:700;font-size:1.15rem}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--red)}
main{max-width:560px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
label{display:block;margin:14px 0 4px;font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.btn{margin-top:12px;padding:11px 16px;border:0;border-radius:6px;background:var(--red);color:#fff;font:inherit;font-weight:700}
.item{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.min{font-size:1.5rem;font-weight:800;color:var(--red);white-space:nowrap}
.sub{color:var(--muted);font-size:.9rem}
#msg{margin-top:12px;color:var(--red)}
</style>
</head>
<body>
<header>Transmi App</header>
<nav>
  <button id="t-llegadas" class="on" onclick="tab('llegadas')">Llegadas</button>
  <button id="t-ajustes" onclick="tab('ajustes')">Ajustes</button>
</nav>
<main>
  <section id="s-llegadas" class="on">
    <label for="q">Busca una estación o paradero</label>
    <input id="q" placeholder="Portal Norte, Calle 72…">
    <button class="btn" onclick="buscar()">Buscar</button>
    <div id="msg"></div>
    <div id="lista"></div>
    <h3 id="titulo"></h3>
    <div id="llegadas"></div>
  </section>

  <section id="s-ajustes">
    <p class="sub">Tus claves se guardan solo en este dispositivo.</p>
    <label for="k-croma">Clave de Croma</label>
    <input id="k-croma" type="password" autocomplete="off">
    <label for="k-gemini">Clave de Gemini</label>
    <input id="k-gemini" type="password" autocomplete="off">
    <label for="k-groq">Clave de Groq</label>
    <input id="k-groq" type="password" autocomplete="off">
    <button class="btn" onclick="guardar()">Guardar claves</button>
    <div id="ok" class="sub"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const CLAVES = ['croma', 'gemini', 'groq'];
let timer = null;

function leer(k) { try { return localStorage.getItem('clave_' + k) || ''; } catch (e) { return ''; } }
function escribir(k, v) { try { localStorage.setItem('clave_' + k, v); } catch (e) {} }

function tab(n) {
  ['llegadas', 'ajustes'].forEach(x => {
    $('s-' + x).classList.toggle('on', x === n);
    $('t-' + x).classList.toggle('on', x === n);
  });
}

function guardar() {
  CLAVES.forEach(k => escribir(k, $('k-' + k).value.trim()));
  $('ok').textContent = 'Claves guardadas.';
}
CLAVES.forEach(k => { $('k-' + k).value = leer(k); });
if (!leer('croma')) tab('ajustes');

async function croma(ruta, cuerpo) {
  const r = await fetch('https://api.croma.run/co/transmilenio/' + ruta, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + leer('croma'), 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo)
  });
  if (!r.ok) throw new Error('Croma respondió con error ' + r.status);
  return r.json();
}

async function buscar() {
  $('msg').textContent = ''; $('lista').innerHTML = '';
  try {
    const d = await croma('stops-search/v1', { query: $('q').value.trim(), per_page: 8 });
    if (!d.stops.length) { $('msg').textContent = 'No encontré paraderos con ese nombre.'; return; }
    d.stops.forEach(s => {
      const b = document.createElement('button');
      b.className = 'item';
      b.textContent = s.name;
      b.onclick = () => elegir(s);
      $('lista').appendChild(b);
    });
  } catch (e) {
    $('msg').textContent = 'No se pudo buscar. Revisa tu clave de Croma en Ajustes. ' + e.message;
  }
}

function elegir(s) {
  $('lista').innerHTML = '';
  $('titulo').textContent = s.name;
  clearInterval(timer);
  cargar(s.stop_id);
  timer = setInterval(() => cargar(s.stop_id), 20000);
}

async function cargar(id) {
  try {
    const d = await croma('stop-arrivals/v1', { stop_id: id, limit: 10 });
    $('llegadas').innerHTML = '';
    if (!d.arrivals.length) { $('llegadas').textContent = 'No hay buses en camino ahora.'; return; }
    d.arrivals.forEach(a => {
      const atraso = Math.round(a.delay_seconds / 60);
      const nota = atraso > 0 ? 'va ' + atraso + ' min atrasado' : 'a tiempo';
      const div = document.createElement('div');
      div.className = 'item row';
      const izq = document.createElement('div');
      izq.innerHTML = '<strong></strong><div class="sub"></div>';
      izq.firstChild.textContent = a.route_code;
      izq.lastChild.textContent = a.route_name + ' · ' + nota;
      const der = document.createElement('div');
      der.className = 'min';
      der.textContent = Math.round(a.minutes_away) + ' min';
      div.append(izq, der);
      $('llegadas').appendChild(div);
    });
  } catch (e) {
    $('llegadas').textContent = 'No se pudieron cargar las llegadas. ' + e.message;
  }
}
</script>
</body>
</html>
